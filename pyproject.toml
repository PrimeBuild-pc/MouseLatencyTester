[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latency-tester"
version = "1.1.0"
description = "Microsecond mouse click latency benchmarking with a Teensy 2.0 probe"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["latency", "mouse", "benchmark", "teensy", "input-lag"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Benchmark",
    "Topic :: System :: Hardware",
]
dependencies = [
    "pyserial>=3.5",
    "pynput>=1.7.6",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.gui-scripts]
latency-tester = "latency_tester.app:main"

[tool.setuptools]
packages = ["latency_tester", "latency_tester.views"]

[tool.setuptools.package-data]
latency_tester = ["locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["latency_tester"]
# The GUI is deliberately not measured: tkinter is not pixel-tested, so
# including it would only produce a number that says nothing about test
# quality. What is measured is everything the measurement pipeline runs on.
omit = [
    "latency_tester/app.py",
    "latency_tester/views/*",
    "latency_tester/widgets.py",
    "latency_tester/theme.py",
    "latency_tester/__main__.py",
    "latency_tester/constants.py",
]

[tool.coverage.report]
# The coverage badge in the README must never be able to drift down silently.
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
