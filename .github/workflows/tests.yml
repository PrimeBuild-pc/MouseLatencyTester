name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # The suite is GUI-free by design: the measurement, protocol and
        # database layers never import tkinter, so this runs headless.
        run: python -m pytest tests -q

      - name: Coverage floor
        # Keeps the README badge honest: the run fails if non-GUI coverage
        # drops below the threshold in pyproject.toml.
        if: matrix.python == '3.12'
        run: python -m pytest tests -q --cov

  locales:
    name: Locale integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-cov
      - name: Validate every locale against English
        run: python -m pytest tests/test_locales.py -q
